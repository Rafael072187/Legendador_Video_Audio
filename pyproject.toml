[project]
name = "legendador-video-audio"
version = "0.1.0"
description = "Gera legendas SRT e VTT localmente, sem APIs pagas, usando o Whisper na sua própria máquina."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "streamlit>=1.57.0",
]

[project.scripts]
legendador = "cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "legendador.py",
    "legendas.py",
    "insercao.py",
    "ui.py",
    "tela_extrair.py",
    "tela_inserir.py",
    "cli.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
